name: main-guard

# Every commit on main must come from a merged pull request (R-C4). A direct push cannot be blocked
# before branch protection exists, so it is detected afterwards and alerted to PILOT_DEV_ALERTS.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: commit to check; default = the pushed commit
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Commit on main came from a merged PR
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # The PILOT_DEV_ALERTS Telegram secrets exist only in the dev environment.
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check out the shared actions from 1_mvp_infra@env/dev
        id: infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host
            projects

      - name: Check the commit's pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: bin/main-guard

      - name: Alert PILOT_DEV_ALERTS
        if: failure() && steps.check.outcome == 'failure'
        uses: ./infra-helpers/.github/actions/notify-telegram
        env:
          TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID }}
        with:
          topic: PILOT_DEV_ALERTS
          message: ${{ steps.check.outputs.message }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send the message without the shared actions
        if: "!cancelled() && steps.infra.outcome == 'failure'"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID }}
          MESSAGE: ${{ steps.check.outputs.message || format('⚠️ {0} cannot send its alerts, INFRA_READ_TOKEN could not check out the shared actions', github.workflow) }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::the shared actions could not be checked out from ${GITHUB_REPOSITORY_OWNER}/1_mvp_infra@env/dev: INFRA_READ_TOKEN is missing, expired or cannot read that repository; sending the message straight to Telegram"
          args=(--data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${MESSAGE}")
          [[ -z "${THREAD_ID}" ]] || args+=(--data-urlencode "message_thread_id=${THREAD_ID}")
          curl -sS -m 20 --fail -o /dev/null -K - "${args[@]}" <<< "url = \"https://api.telegram.org/bot${BOT_TOKEN}/sendMessage\""
          exit 1
