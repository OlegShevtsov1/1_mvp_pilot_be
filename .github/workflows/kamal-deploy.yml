name: Kamal Deploy

# Deploys a release to prod with Kamal 2 (config/deploy.yml) through the shared mvp VPN
# (vpn-up/vpn-down from 1_mvp_infra). Nothing is built: deploy/deploy.sh prod promotes the image
# sha-<sha> that Dev Deploy built for the tagged commit to prod-sha-<sha> (same layers, prod service
# label) and, after /health and the read-only smoke pass, points the ECR tag prod-current at it (the
# image it replaces becomes prod-previous). See README "Prod deploy" and "Релізи й hotfix".
#
# Dual control: runs only from main, with environment=prod, confirm=prod and a version that is a
# release tag vX.Y.Z, annotated and on main, whose image is already in ECR; a bare sha is refused.
#
# Two modes (decision 43). Primary (vars.MIRROR unset): version only, the image of the tag's commit.
# Mirror (vars.MIRROR == 'true', the public copy prod deploys from since v0.2.0): version and
# source_sha, the primary commit of the tag; the guard refuses unless MIRROR_SOURCE.json records that
# pair and the mirror's tag passes the same tag checks, and the image sha-<source_sha> the primary's
# Dev Deploy built is promoted, never built here.
#
# release-watch then watches prod for 10 minutes (/health every 30 s, then the new GlitchTip
# issues of <PROJECT_NAME>-be-prod) and reports ✅ or ❌. It never rolls back: a person decides.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [prod]
      version:
        description: Release tag vX.Y.Z (annotated, on main); a bare sha is refused
        required: true
        type: string
      source_sha:
        description: Mirror only (vars.MIRROR=true), required there - the 40-hex primary commit of the tag, as recorded in MIRROR_SOURCE.json; leave empty on the primary
        required: false
        type: string
      confirm:
        description: Type prod to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  guard:
    name: ${{ vars.MIRROR == 'true' && 'Guard, mirror mode (ref, confirm, version, source_sha)' || 'Guard, primary mode (ref, confirm, version)' }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      version: ${{ steps.mirror.outputs.version || steps.tag.outputs.version }}
      source_sha: ${{ steps.inputs.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the ref and the inputs
        id: inputs
        env:
          REF: ${{ github.ref }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
          MIRROR: ${{ vars.MIRROR == 'true' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: deploy/prod_guard.sh deploy >> "${GITHUB_OUTPUT}"

      - name: Check that the version is an annotated release tag on main
        id: tag
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: deploy/release_tag_check.sh "${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check the version and source_sha against MIRROR_SOURCE.json
        id: mirror
        if: vars.MIRROR == 'true'
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: deploy/mirror_source_check.sh "${TAG}" "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  # Only names are checked and printed, never values.
  preflight:
    name: Preflight (secrets)
    needs: guard
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Check that every required secret is set
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          VPN_CI_OVPN: ${{ secrets.VPN_CI_OVPN }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ALLOWED_FE_DSN: ${{ secrets.SENTRY_ALLOWED_FE_DSN }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
        run: |
          source deploy/_common.sh
          # PROJECT_NAME comes from config/project.env and KAMAL_REGISTRY_PASSWORD from the ECR
          # login inside deploy.sh; every other variable .kamal/secrets.prod reads is a secret.
          mapfile -t kamal_secrets < <(secret_names .kamal/secrets.prod | grep -vxE 'PROJECT_NAME|KAMAL_REGISTRY_PASSWORD')
          required=(
            AWS_ROLE_ARN VPN_CI_OVPN PROD_SSH_KEY PROD_VPN_IP INFRA_READ_TOKEN
            "${kamal_secrets[@]}"
            TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${GITHUB_WORKFLOW} cannot start, missing secrets: ${missing[*]} (see README \"Prod deploy\")"
            exit 1
          fi
          echo "all required secrets are set: ${required[*]}"

  # The shared actions (vpn-up, vpn-down, notify-telegram) come from a checkout of the owner's 1_mvp_infra
  # made with INFRA_READ_TOKEN: a public copy of this repository cannot use actions from a private one.
  # The probe checks that checkout once, before anything is built or touched.
  probe:
    name: Probe (shared VPN actions)
    needs: preflight
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Check that INFRA_READ_TOKEN is set
        env:
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: |
          if [[ -z "${INFRA_READ_TOKEN}" ]]; then
            echo "::error::INFRA_READ_TOKEN is not set: the shared actions cannot be checked out from ${GITHUB_REPOSITORY_OWNER}/1_mvp_infra (see README \"Dev deploy\")"
            exit 1
          fi
          echo "INFRA_READ_TOKEN is set"

      - name: Check out the shared actions from 1_mvp_infra@env/dev
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host
            projects

      - name: Check that vpn-up, vpn-down and notify-telegram are there
        run: |
          missing=()
          for name in vpn-up vpn-down notify-telegram; do
            [[ -f "infra-helpers/.github/actions/${name}/action.yml" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${GITHUB_REPOSITORY_OWNER}/1_mvp_infra@env/dev, checked out with INFRA_READ_TOKEN, has no ${missing[*]}"
            exit 1
          fi
          echo "vpn-up, vpn-down and notify-telegram are available"

  deploy:
    name: Deploy (VPN + Kamal)
    needs: [guard, probe]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 30
    # Shared with Kamal Manage, on this job only: two prod operations never overlap, and a
    # rollback does not wait for release-watch.
    concurrency:
      group: kamal-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
      SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the shared actions from 1_mvp_infra@env/dev
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host
            projects

      # Before vpn-up: everything slow happens outside the VPN lock window.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install crane
        env:
          CRANE_VERSION: 0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${RUNNER_TEMP}/crane.tgz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/crane.tgz" -C "${RUNNER_TEMP}/bin" crane
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check that the version was built by Dev Deploy
        run: |
          source deploy/_common.sh
          load_project_env
          resolve_registry
          crane_login
          require_dev_image "${VERSION}" > /dev/null
          echo "${PROJECT_NAME}:${VERSION} is in ECR"

      - name: Load the prod SSH key into an agent (never written to disk)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          eval "$(ssh-agent -a "${RUNNER_TEMP}/ssh-agent.sock")" > /dev/null
          ssh-add - <<< "${PROD_SSH_KEY}"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: VPN up
        uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}
          ci-vpn-ip: ${{ secrets.CI_VPN_IP }}
          dev-host: ${{ secrets.DEV_HOST }}
          dns-zones: ${{ vars.DNS_ZONES }}

      - name: Check that prod is reachable over the VPN
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
        run: |
          for attempt in 1 2 3; do
            if nc -z -w 5 "${PROD_VPN_IP}" 22; then
              echo "prod SSH is reachable over the VPN"
              exit 0
            fi
            echo "attempt ${attempt}: prod SSH not reachable yet"
            sleep 5
          done
          echo "::error::prod SSH is not reachable over the VPN"
          exit 1

      - name: Deploy
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ALLOWED_FE_DSN: ${{ secrets.SENTRY_ALLOWED_FE_DSN }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: deploy/deploy.sh prod "${TAG}" ${SOURCE_SHA:+"${SOURCE_SHA}"}

      - name: VPN down
        if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

  # Polls the public URL without the VPN; the shared VPN lock is held only for the one GlitchTip
  # query at the end, so other deploys are not blocked for 10 minutes.
  release-watch:
    name: Release watch (10 min)
    needs: [guard, deploy]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the shared actions from 1_mvp_infra@env/dev
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host
            projects

      - name: Watch /health for 10 minutes
        id: health
        run: deploy/release_watch.sh health "${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: VPN up
        uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}
          ci-vpn-ip: ${{ secrets.CI_VPN_IP }}
          dev-host: ${{ secrets.DEV_HOST }}
          dns-zones: ${{ vars.DNS_ZONES }}

      - name: Count new GlitchTip issues
        id: glitchtip
        continue-on-error: true
        env:
          SINCE: ${{ steps.health.outputs.since }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
        run: |
          deploy/glitchtip_issues.sh "${SINCE}" > "${RUNNER_TEMP}/issues.jsonl"
          echo "new issues since the watch started: $(grep -c . "${RUNNER_TEMP}/issues.jsonl" || true) ($(jq -r .shortId "${RUNNER_TEMP}/issues.jsonl" | paste -sd ' ' -))"

      - name: VPN down
        if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

      - name: Verdict
        id: verdict
        if: always()
        env:
          CHECKS: ${{ steps.health.outputs.checks }}
          FAILED: ${{ steps.health.outputs.failed }}
          GLITCHTIP_OUTCOME: ${{ steps.glitchtip.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ISSUES_FILE="${RUNNER_TEMP}/issues.jsonl" deploy/release_watch.sh verdict >> "${GITHUB_OUTPUT}"

      - name: Notify (Telegram)
        if: always()
        uses: ./infra-helpers/.github/actions/notify-telegram
        env:
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
        with:
          topic: PILOT_PROD_ALERTS
          message: ${{ steps.verdict.outputs.message || format('❌ release-watch {0} could not report its result {1}/{2}/actions/runs/{3}', needs.guard.outputs.tag, github.server_url, github.repository, github.run_id) }}

      - name: Fail on ❌
        if: always() && steps.verdict.outputs.result != 'ok'
        run: exit 1

  report:
    name: Report
    needs: [guard, preflight, probe, deploy]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      message: ${{ steps.summarize.outputs.message }}
    steps:
      - name: Summarize the job results
        id: summarize
        env:
          VERSION: ${{ needs.guard.outputs.tag || inputs.version }}
          MODE: ${{ vars.MIRROR == 'true' && 'mirror' || 'primary' }}
          GUARD: ${{ needs.guard.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          PROBE: ${{ needs.probe.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          explain() {
            case "$1" in
              guard)
                if [[ "${MODE}" == 'mirror' ]]; then
                  echo 'refused (mirror mode): workflow ref is not main, confirm/environment invalid, source_sha is not 40 hex, the version is not an annotated release tag vX.Y.Z on main, or MIRROR_SOURCE.json does not record that source_sha for it; nothing touched prod'
                else
                  echo 'refused (primary mode): workflow ref is not main, confirm/environment invalid, or the version is not an annotated release tag vX.Y.Z on main (a bare sha or a source_sha is refused); nothing touched prod'
                fi
                ;;
              preflight) echo 'required secrets are missing: see the preflight error for their names and README "Prod deploy"' ;;
              probe) echo "the shared actions could not be checked out from ${GITHUB_REPOSITORY_OWNER}/1_mvp_infra@env/dev: INFRA_READ_TOKEN is missing, expired or cannot read that repository (see README \"Dev deploy\")" ;;
              deploy) echo 'the image check, the VPN, Kamal, the health check or the swagger smoke failed: see the deploy log' ;;
            esac
          }
          jobs=(guard preflight probe deploy)
          results=("${GUARD}" "${PREFLIGHT}" "${PROBE}" "${DEPLOY}")
          {
            echo '| job | result |'
            echo '| --- | --- |'
            for i in "${!jobs[@]}"; do
              echo "| ${jobs[i]} | ${results[i]} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
          failed=''
          for i in "${!jobs[@]}"; do
            if [[ "${results[i]}" == 'failure' || "${results[i]}" == 'cancelled' ]]; then
              failed="${jobs[i]}"
              break
            fi
          done
          if [[ -n "${failed}" ]]; then
            message="❌ Kamal Deploy prod ${VERSION:0:16} (${MODE}) failed in ${failed}: $(explain "${failed}") ${RUN_URL}"
            echo "::error::${failed} failed: $(explain "${failed}")"
          else
            message="✅ Kamal Deploy prod ${VERSION:0:16} (${MODE}) succeeded ${RUN_URL}"
          fi
          echo "message=${message}" >> "${GITHUB_OUTPUT}"
          echo "FAILED_JOB=${failed}" >> "${GITHUB_ENV}"

      - name: Fail when a job failed
        if: env.FAILED_JOB != ''
        run: exit 1

  notify:
    name: Notify (Telegram)
    needs: [report]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    steps:
      - name: Check out the shared actions from 1_mvp_infra@env/dev
        id: infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host
            projects

      - uses: ./infra-helpers/.github/actions/notify-telegram
        env:
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
        with:
          topic: PILOT_PROD_ALERTS
          message: ${{ needs.report.outputs.message || format('❌ Kamal Deploy could not report its result {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

      - name: Send the message without the shared actions
        if: "!cancelled() && steps.infra.outcome == 'failure'"
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
          MESSAGE: ${{ needs.report.outputs.message || format('❌ Kamal Deploy could not report its result {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          echo "::error::the shared actions could not be checked out from ${GITHUB_REPOSITORY_OWNER}/1_mvp_infra@env/dev: INFRA_READ_TOKEN is missing, expired or cannot read that repository; sending the message straight to Telegram"
          args=(--data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${MESSAGE}")
          [[ -z "${THREAD_ID}" ]] || args+=(--data-urlencode "message_thread_id=${THREAD_ID}")
          curl -sS -m 20 --fail -o /dev/null -K - "${args[@]}" <<< "url = \"https://api.telegram.org/bot${BOT_TOKEN}/sendMessage\""
          exit 1
